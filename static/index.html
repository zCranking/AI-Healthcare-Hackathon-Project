<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veritas Charting — clinical note drift auditing</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M12%202.2%204.5%205.4V11.2C4.5%2016.1%207.8%2019.9%2012%2021.8%2016.2%2019.9%2019.5%2016.1%2019.5%2011.2V5.4Z'%20fill='%231a6fc4'/%3E%3Cpath%20d='M6.5%2012.2H9.2L10.4%209.2%2012.4%2015%2013.9%2010.8%2014.7%2012.2H17.5'%20fill='none'%20stroke='white'%20stroke-width='1.7'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
<script>
  /* apply saved / preferred theme before first paint to avoid a flash */
  (function () {
    try {
      var t = localStorage.getItem("veritas-theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  /* ---- design tokens (Veritas Charting — medical blues) ---- */
  :root {
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;

    /* neutrals — clean clinical blue-grays */
    --bg: #eef3f9;
    --ink: #0d1b2a;
    --ink-2: #223342;
    --muted: #46586b;
    --muted-2: #647688;
    --muted-3: #8595a6;
    --muted-4: #a6b3c2;

    /* brand — medical azure / navy (names kept as --indigo* for compatibility) */
    --indigo: #1a6fc4;
    --indigo-hi: #135aa6;
    --indigo-dk: #0c477f;
    --indigo-tint: #e6f0fb;
    --teal: #0f766e;

    --line: #e2e8f0;
    --line-2: #eaeff5;
    --line-3: #f1f5f9;
    --line-strong: #d4deea;
    --hover: #eef3f9;
    --card: #ffffff;
    --field: #f5f8fc;

    --ok: #12a150;
    --ok-tint: #e7f6ee;
    --hl: #ffe9a6;
    --anchor-bg: #fffaf0;
    --anchor-border: #f0d79a;

    --sk-base: #e4eaf1;
    --sk-hi: #f3f7fb;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0a121c;
    --ink: #e9eef5;
    --ink-2: #ccd7e3;
    --muted: #9db0c3;
    --muted-2: #8496a9;
    --muted-3: #6a7d91;
    --muted-4: #55697d;

    --indigo: #4b9bea;
    --indigo-hi: #6cb0f0;
    --indigo-dk: #bfdcf7;
    --indigo-tint: #14304c;
    --teal: #4cc5ba;

    --line: #24303e;
    --line-2: #1c2733;
    --line-3: #16202b;
    --line-strong: #33414f;
    --hover: #18232f;
    --card: #121d29;
    --field: #0f1823;

    --ok: #2bbd7a;
    --ok-tint: #10241b;
    --hl: #5c4a15;
    --anchor-bg: #2a2410;
    --anchor-border: #5c4a15;

    --sk-base: #1a2531;
    --sk-hi: #243243;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, select, textarea, input { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-4); }
  select:focus, textarea:focus, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--indigo); outline-offset: 1px;
  }
  @keyframes dwspin { to { transform: rotate(360deg); } }
  @keyframes dwrise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes dwshimmer { 0% { background-position: -450px 0; } 100% { background-position: 450px 0; } }
  @keyframes dwpulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  .mono { font-family: var(--font-mono); }
  .display { font-family: var(--font-display); }
  .rise { animation: dwrise .2s ease; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line-strong); border-top-color: var(--indigo);
    animation: dwspin .7s linear infinite;
  }
  .btn-primary {
    border: none; border-radius: 11px; background: var(--indigo); color: #fff;
    font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(26,111,196,.32);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover { background: var(--indigo-hi); }
  .btn-primary:disabled { opacity: .6; cursor: default; box-shadow: none; }
  mark.dw {
    background: var(--hl); color: var(--ink); border-radius: 3px; padding: 1px 2px;
    box-shadow: 0 0 0 1px rgba(198,119,0,.25);
  }
  /* brand mark — shield + pulse, inherits the accent via currentColor */
  .dw-logo { display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--indigo); filter: drop-shadow(0 2px 5px rgba(26,111,196,.28)); }
  [data-theme="dark"] .dw-logo { filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }

  /* light / dark theme toggle */
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--muted-2);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: .15s;
  }
  .theme-toggle:hover { color: var(--indigo); border-color: var(--indigo); }
  .theme-toggle .ico-sun { display: none; }
  [data-theme="dark"] .theme-toggle .ico-moon { display: none; }
  [data-theme="dark"] .theme-toggle .ico-sun { display: inline-flex; }

  /* shimmering skeleton placeholders shown while a run is in flight */
  .sk {
    background: linear-gradient(90deg, var(--sk-base) 25%, var(--sk-hi) 37%, var(--sk-base) 63%);
    background-size: 800px 100%; border-radius: 8px;
    animation: dwshimmer 1.4s ease-in-out infinite;
  }
  .sk-line { height: 11px; border-radius: 6px; }
  .sk-card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 13px 14px; }
  @media (prefers-reduced-motion: reduce) {
    .sk, .spinner, .rise { animation: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   Tiny safe DOM helper — every server string goes through
   textContent / text nodes, so nothing is ever injected raw.
   ============================================================ */
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "style") e.style.cssText = v;
      else if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "html") { /* intentionally unused */ }
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  const add = (c) => {
    if (c == null || c === false || c === true) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  };
  children.forEach(add);
  return e;
}
const $ = (id) => document.getElementById(id);

/* ---------------- color systems (from the mockup) ---------------- */
const STATUS = {
  supported:    { c: "#12a150", t: "#e7f6ee" },
  unsupported:  { c: "#c77700", t: "#fbf1e0" },
  contradicted: { c: "#d64545", t: "#fbeaea" },
  omitted:      { c: "#8256d0", t: "#f2ecfb" },
};
const SEV = { high: "#d64545", medium: "#c77700", low: "#8a94a3", split: "#d64545" };
const VERDICT = { confirm: "#12a150", reject: "#8a94a3", split: "#d64545" };
const SOURCE_META = {
  transcript: { label: "transcript", c: "#0f766e", t: "#e6f4f1" },
  fhir:       { label: "FHIR chart", c: "#155fb0", t: "#e6f0fb" },
  both:       { label: "transcript + FHIR", c: "#8256d0", t: "#f2ecfb" },
  neither:    { label: "no source", c: "#8a94a3", t: "#f2f3f6" },
};

/* ---------------- application state ---------------- */
const state = {
  screen: "picker",       // picker | running | results
  source: "abridge",      // abridge | synthetic | custom
  abridge: [],            // encounter options
  abridgeIndex: null,
  regenerate: false,
  recent: [],             // prior run payloads
  payload: null,          // current result payload
  selectedId: null,       // index into merged findings
  filter: "all",
  tab: "evidence",        // evidence | transcript | note | traps
  stageIndex: 0,
  error: null,
};

const STAGES = [
  "Transcript ingested",
  "Note generated (system under test)",
  "Tracing claims to the transcript & chart",
  "Polling 3 independent judges",
  "Aggregating report",
];

/* ---------------- API ----------------
   Two modes, decided once at startup:
     live  - a FastAPI backend is serving /api/* (uvicorn main:app)
     demo  - no backend (e.g. GitHub Pages). We replay a real saved run from
             demo/sample_run.json so the UI is fully explorable with no API key
             and no cost. Detection is a probe of /api/abridge, so the same
             index.html works in both places with no build step or config.
*/
const DEMO_DATA_URL = "demo/sample_run.json";
let DEMO_MODE = false;      // set by detectMode()
let _demoRun = null;        // lazily fetched saved run

async function loadDemoRun() {
  if (_demoRun) return _demoRun;
  const r = await fetch(DEMO_DATA_URL);
  if (!r.ok) throw new Error("Demo data unavailable (" + r.status + ")");
  _demoRun = await r.json();
  return _demoRun;
}

async function detectMode() {
  try {
    const r = await fetch("/api/abridge", { method: "GET" });
    DEMO_MODE = !r.ok;
  } catch (_) {
    DEMO_MODE = true;       // no backend reachable
  }
  if (DEMO_MODE) document.body.classList.add("demo-mode");
  return DEMO_MODE;
}

async function apiAbridge() {
  if (DEMO_MODE) {
    const d = await loadDemoRun();
    return d.encounters || [];
  }
  const r = await fetch("/api/abridge");
  if (!r.ok) throw new Error("Failed to load encounters (" + r.status + ")");
  return r.json();
}
async function apiResults() {
  if (DEMO_MODE) {
    const d = await loadDemoRun();
    return d.run ? [d.run] : [];
  }
  try {
    const r = await fetch("/api/results");
    if (!r.ok) return [];
    return r.json();
  } catch (_) { return []; }
}
async function apiRun(body) {
  if (DEMO_MODE) {
    // Replay the saved run. Brief delay so the pipeline stage animation is
    // still visible - this is a demo of the flow, not a fake loading bar.
    const d = await loadDemoRun();
    await new Promise((res) => setTimeout(res, 900));
    return d.run;
  }
  const r = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.detail) || ("Run failed (" + r.status + ")"));
  return data;
}

/* ---------------- derived data helpers ---------------- */
function judgedFor(payload, f) {
  return (payload.judged || []).find((j) =>
    j.finding &&
    j.finding.claim === f.claim &&
    j.finding.status === f.status &&
    j.finding.transcript_evidence === f.transcript_evidence
  ) || null;
}

// merge findings with their judge verdicts and assign stable ids
function mergedFindings(payload) {
  return (payload.findings || []).map((f, i) => {
    const j = judgedFor(payload, f);
    return {
      id: i,
      claim: f.claim,
      status: f.status,
      severity: f.severity,
      evidence: f.transcript_evidence,
      evidenceSource: f.evidence_source,
      escalated: !!j,
      consensus: j ? j.consensus_verdict : null,
      sevVerdict: j ? j.severity_verdict : f.severity,
      disagreement: j ? !!j.disagreement : false,
      confirm: j ? j.confirm_votes : 0,
      reject: j ? j.reject_votes : 0,
      votes: j ? (j.votes || []) : [],
      harm: j ? (j.harm_if_trusted || "") : "",
    };
  });
}

const SEV_RANK = { high: 0, medium: 1, low: 2, split: 0 };
const STATUS_RANK = { contradicted: 0, omitted: 1, unsupported: 2, supported: 3 };

function orderFindings(list) {
  return list.slice().sort((a, b) => {
    const ea = a.escalated && a.consensus === "confirm" ? 0 : 1;
    const eb = b.escalated && b.consensus === "confirm" ? 0 : 1;
    if (ea !== eb) return ea - eb;
    const sa = SEV_RANK[a.severity] ?? 3, sb = SEV_RANK[b.severity] ?? 3;
    if (sa !== sb) return sa - sb;
    return (STATUS_RANK[a.status] ?? 4) - (STATUS_RANK[b.status] ?? 4);
  });
}
function matchFilter(f, key) {
  switch (key) {
    case "drifts": return f.status !== "supported";
    case "high": return f.severity === "high";
    case "splits": return f.disagreement;
    case "confirmed": return f.escalated && f.consensus === "confirm";
    default: return true;
  }
}

/* ---------------- small view helpers ---------------- */
function pill(text, opts) {
  opts = opts || {};
  const s =
    "font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; " +
    "padding:3px 8px; border-radius:14px; white-space:nowrap; " +
    (opts.bg ? "background:" + opts.bg + ";" : "") +
    (opts.color ? "color:" + opts.color + ";" : "") +
    (opts.border ? "border:1px solid " + opts.border + ";" : "");
  return el("span", { style: s }, text);
}

function statusPill(f) {
  const sc = STATUS[f.status] || STATUS.unsupported;
  return pill(f.status, { color: sc.c, bg: sc.t });
}
function sevPill(sev) {
  const c = SEV[sev] || SEV.low;
  return pill((sev === "split" ? "split" : sev) + " severity", { color: c, border: c });
}
function sourcePill(src) {
  const m = SOURCE_META[src] || SOURCE_META.neither;
  return pill("src · " + m.label, { color: m.c, bg: m.t });
}
function verdictPill(f) {
  const c = f.disagreement ? VERDICT.split : (VERDICT[f.consensus] || VERDICT.reject);
  return pill(f.consensus || "", { color: "#fff", bg: c });
}
function splitPill() {
  return el("span", {
    style: "font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; " +
           "padding:3px 8px; border-radius:14px; color:#d64545; background:#fbeaea; " +
           "display:inline-flex; align-items:center; gap:4px;",
  }, el("span", { style: "width:5px; height:5px; border-radius:50%; background:#d64545;" }), "judges split");
}

// parse a transcript string into speaker turns
function parseTranscript(text) {
  const lines = String(text || "").split(/\r?\n/);
  const turns = [];
  const re = /^\s*([A-Za-z][A-Za-z .#0-9_-]{0,24}?)\s*[:\-–]\s+(.*)$/;
  for (const raw of lines) {
    if (!raw.trim()) continue;
    const m = raw.match(re);
    if (m) {
      turns.push({ speaker: m[1].trim(), text: m[2].trim() });
    } else if (turns.length) {
      turns[turns.length - 1].text += " " + raw.trim();
    } else {
      turns.push({ speaker: "", text: raw.trim() });
    }
  }
  return turns;
}
function speakerRole(sp) {
  const s = sp.toLowerCase();
  if (/^(dr|doc|doctor|physician|clinician|provider|md|prov)/.test(s)) return "dr";
  if (/^(pt|patient|pat)/.test(s)) return "pt";
  return "other";
}
// pull the longest quoted span out of an evidence string, for highlighting
function extractQuote(ev) {
  if (!ev) return null;
  const quotes = ev.match(/[“"']([^“”"']{6,})[”"']/g) || [];
  let best = null;
  for (const q of quotes) {
    const inner = q.replace(/^[“"']|[”"']$/g, "");
    if (!best || inner.length > best.length) best = inner;
  }
  return best;
}
// render a text string, highlighting the first occurrence of `needle` (case-insensitive)
function highlighted(text, needle) {
  text = String(text || "");
  if (!needle) return [document.createTextNode(text)];
  const i = text.toLowerCase().indexOf(needle.toLowerCase());
  if (i < 0) return [document.createTextNode(text)];
  const out = [];
  if (i > 0) out.push(document.createTextNode(text.slice(0, i)));
  out.push(el("mark", { class: "dw" }, text.slice(i, i + needle.length)));
  const rest = text.slice(i + needle.length);
  if (rest) out.push(document.createTextNode(rest));
  return out;
}

/* ============================================================
   RENDER: mount
   ============================================================ */
function render() {
  const root = $("app");
  root.textContent = "";
  if (state.screen === "picker") root.appendChild(renderPicker());
  else if (state.screen === "running") root.appendChild(renderRunning());
  else root.appendChild(renderResults());
}

/* ---------------- header logo ---------------- */
// Shield-with-pulse mark: trust (shield) + clinical signal integrity (ECG line).
// Monochrome — the shield inherits the accent via currentColor / --indigo.
function logo(size) {
  const s = el("span", { class: "dw-logo", style: "width:" + size + "px; height:" + size + "px;" });
  s.innerHTML =
    "<svg viewBox='0 0 24 24' width='" + size + "' height='" + size + "' fill='none' aria-hidden='true' focusable='false'>" +
      "<path d='M12 2.2 4.5 5.4V11.2C4.5 16.1 7.8 19.9 12 21.8 16.2 19.9 19.5 16.1 19.5 11.2V5.4Z' fill='currentColor'/>" +
      "<path d='M6.5 12.4H9.2L10.4 9.3 12.4 15.1 13.9 10.9 14.7 12.4H17.5' fill='none' stroke='#ffffff' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/>" +
    "</svg>";
  return s;
}

/* ---------------- light / dark theme toggle ---------------- */
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("veritas-theme", next); } catch (e) {}
}
function themeToggle() {
  const b = el("button", {
    class: "theme-toggle", type: "button",
    title: "Toggle light / dark theme", "aria-label": "Toggle light and dark theme",
    onclick: toggleTheme,
  });
  b.innerHTML =
    "<svg class='ico-moon' viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>" +
      "<path d='M21 12.6A8.4 8.4 0 1 1 11.4 3 6.6 6.6 0 0 0 21 12.6Z'/></svg>" +
    "<svg class='ico-sun' viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>" +
      "<circle cx='12' cy='12' r='4'/>" +
      "<path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/></svg>";
  return b;
}

/* ============================================================
   SCREEN 1 — PICKER
   ============================================================ */
function renderPicker() {
  const wrap = el("div", { style: "min-height:100vh;" });
  const page = el("div", { style: "max-width:1120px; margin:0 auto; padding:0 28px 64px;" });
  wrap.appendChild(page);

  // top bar
  page.appendChild(el("div", { style: "display:flex; align-items:center; gap:12px; padding:22px 0 6px;" },
    logo(34),
    el("div", { class: "display", style: "font-weight:700; font-size:18px; letter-spacing:-.01em;" }, "Veritas Charting"),
    el("div", { class: "mono", style: "margin-left:auto; font-size:12px; color:var(--muted-2); display:flex; gap:14px; align-items:center;" },
      el("span", null, "model · claude"),
      el("span", { style: "width:6px; height:6px; border-radius:50%; background:#12a150; box-shadow:0 0 0 3px rgba(18,161,80,.16);" })
    ),
    themeToggle()
  ));

  // demo-mode notice — honest about what the visitor is looking at
  if (DEMO_MODE) {
    page.appendChild(el("div", {
      style: "display:flex; align-items:flex-start; gap:10px; margin:14px 0 0; padding:11px 14px; " +
             "border:1px solid var(--line); border-left:3px solid #d68c45; border-radius:8px; " +
             "background:var(--panel); font-size:13px; line-height:1.55; color:var(--muted);",
    },
      el("span", { style: "font-weight:700; color:#d68c45; white-space:nowrap;" }, "Demo mode"),
      el("span", null,
        "You're viewing a real saved pipeline run — no API key needed, nothing is billed. ",
        "The full harness runs locally: ",
        el("code", { class: "mono", style: "font-size:12px;" }, "uvicorn main:app"),
        " with your own ",
        el("code", { class: "mono", style: "font-size:12px;" }, "ANTHROPIC_API_KEY"),
        "."
      )
    ));
  }

  // hero
  const hero = el("div", { style: "padding:40px 0 34px; border-bottom:1px solid var(--line); margin-bottom:34px;" });
  hero.appendChild(el("div", {
    style: "display:inline-flex; align-items:center; gap:8px; padding:5px 11px; border-radius:20px; " +
           "background:#fbeaea; color:#b23b3b; font-size:12px; font-weight:600; margin-bottom:18px;",
  }, el("span", { style: "width:6px; height:6px; border-radius:50%; background:#d64545;" }),
     "Adversarial red-team harness for ambient scribes"));
  hero.appendChild(el("h1", {
    class: "display",
    style: "font-weight:700; font-size:46px; line-height:1.04; letter-spacing:-.025em; margin:0 0 16px; max-width:780px;",

  const list = el("div", { style: "flex:1; overflow-y:auto; padding:12px 16px 40px;" });
  if (!visible.length) {
    list.appendChild(el("div", { style: "padding:24px 4px; color:var(--muted-3); font-size:13px;" },
      "No findings match this filter."));
  }
  visible.forEach((f) => {
    const selected = f.id === state.selectedId;
    const sc = STATUS[f.status] || STATUS.unsupported;
    const card = el("div", {
      class: "rise",
      onclick: () => { state.selectedId = f.id; state.tab = "evidence"; render(); },
      style: "position:relative; cursor:pointer; padding:12px 14px 12px 18px; margin-bottom:9px; border-radius:12px; " +
             "background:var(--card); transition:.12s; " +
             "border:1px solid " + (selected ? "var(--indigo)" : "var(--line)") + "; " +
             "box-shadow:" + (selected ? "0 0 0 3px rgba(26,111,196,.16), 0 2px 8px rgba(16,32,54,.08)" : "0 1px 2px rgba(16,32,54,.05)") + ";",
    });
    card.appendChild(el("div", { style: "position:absolute; left:0; top:0; bottom:0; width:4px; background:" + sc.c + "; border-radius:12px 0 0 12px;" }));
    const badges = el("div", { style: "display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:8px;" });
    badges.appendChild(statusPill(f));
    badges.appendChild(sourcePill(f.evidenceSource));
    badges.appendChild(sevPill(f.sevVerdict || f.severity));
    if (f.escalated) badges.appendChild(verdictPill(f));
    if (f.disagreement) badges.appendChild(splitPill());
    card.appendChild(badges);
    card.appendChild(el("div", { style: "font-size:13.5px; font-weight:500; line-height:1.4; color:var(--ink);" }, f.claim));
    card.appendChild(el("div", {
      style: "font-size:12px; line-height:1.45; color:var(--muted-3); margin-top:5px; " +
             "display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;",
    }, f.evidence || ""));
    list.appendChild(card);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderEvidencePanel(p, findings, traps) {
  const wrap = el("div", { style: "display:flex; flex-direction:column; min-height:0; background:var(--card);" });

  // tabs
  const tabs = el("div", { style: "display:flex; gap:4px; padding:10px 16px; border-bottom:1px solid var(--line-2); flex:none; flex-wrap:wrap;" });
  const tabDefs = [
    { k: "evidence", l: "Evidence trace" },
    { k: "transcript", l: "Transcript" },
    { k: "note", l: p.note_provided ? "Note (provided)" : "Note" },
  ];
  if (traps.length) tabDefs.push({ k: "traps", l: "Planted traps (" + traps.length + ")" });
  tabDefs.forEach((t) => {
    const on = state.tab === t.k;
    tabs.appendChild(el("button", {
      onclick: () => { state.tab = t.k; render(); afterScroll(); },
      style: "padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; transition:.12s; border:none; " +
             "background:" + (on ? "var(--indigo-tint)" : "transparent") + "; " +
             "color:" + (on ? "var(--indigo-dk)" : "var(--muted-3)") + ";",
    }, t.l));
  });
  wrap.appendChild(tabs);

  const scroll = el("div", { id: "dw-ev-scroll", style: "flex:1; overflow-y:auto;" });
  wrap.appendChild(scroll);

  const sel = findings.find((f) => f.id === state.selectedId) || null;

  if (state.tab === "traps") scroll.appendChild(renderTrapsTab(traps, p.evaluation || null));
  else if (state.tab === "transcript") scroll.appendChild(renderTranscriptTab(p, sel));
  else if (state.tab === "note") scroll.appendChild(renderNoteTab(p, sel));
  else if (!sel) scroll.appendChild(renderNoSelection());
  else scroll.appendChild(renderEvidenceTab(p, sel));

  return wrap;
}

function renderNoSelection() {
  return el("div", {
    style: "flex:1; min-height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; " +
           "text-align:center; padding:40px; color:var(--muted-4);",
  },
    el("div", { style: "width:46px; height:46px; border-radius:12px; background:var(--line-3); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:22px;" }, "◎"),
    el("div", { style: "font-size:15px; font-weight:600; color:var(--muted-2); margin-bottom:6px;" }, "Trace any finding to the source"),
    el("div", { style: "font-size:13px; line-height:1.5; max-width:260px;" },
      "Select a finding on the left to see what the note asserted, what the transcript actually said, and how the three judges voted."));
}

function renderEvidenceTab(p, f) {
  const sc = STATUS[f.status] || STATUS.unsupported;
  const box = el("div", { style: "padding:20px;" });

  const badges = el("div", { style: "display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:10px;" });
  badges.appendChild(statusPill(f));
  badges.appendChild(sourcePill(f.evidenceSource));
  badges.appendChild(sevPill(f.sevVerdict || f.severity));
  box.appendChild(badges);

  box.appendChild(el("div", { style: "font-size:16px; font-weight:600; line-height:1.35; margin-bottom:18px;" }, f.claim));

  // clinical harm callout — the "why this matters" for a confirmed drift
  if (f.harm && f.escalated && f.consensus === "confirm") {
    box.appendChild(el("div", {
      style: "display:flex; gap:11px; margin-bottom:18px; padding:13px 14px; border-radius:12px; " +
             "background:#fbeaea; border:1px solid #f3d0d0;",
    },
      el("div", { style: "font-size:16px; line-height:1.2; flex:none;" }, "⚠"),
      el("div", null,
        el("div", { style: "font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#b23b3b; margin-bottom:4px;" }, "Clinical risk if trusted"),
        el("div", { style: "font-size:13.5px; line-height:1.5; color:#7f2a2a;" }, f.harm))));
  }

  // note asserts -> transcript says
  const chain = el("div", { style: "display:flex; flex-direction:column; margin-bottom:20px;" });
  chain.appendChild(el("div", {
    style: "border:1px solid var(--line); border-radius:12px 12px 0 0; padding:13px 14px; background:var(--field);",
  },
    el("div", { style: "font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-3); margin-bottom:6px;" }, "The note asserts"),
    el("div", { class: "mono", style: "font-size:13.5px; line-height:1.5; color:var(--ink);" }, f.claim)));
  chain.appendChild(el("div", { style: "display:flex; align-items:center; justify-content:center; height:0; position:relative; z-index:1;" },
    el("div", { style: "width:30px; height:30px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted-3); font-size:15px;" }, "↓")));
  const hasEv = f.evidenceSource && f.evidenceSource !== "neither" && f.evidence;
  const evLabel = evidenceLabel(f.evidenceSource);
  chain.appendChild(el("div", {
    style: "border:1px solid " + sc.c + "; border-radius:0 0 12px 12px; padding:13px 14px; background:" + sc.t + ";",
  },
    el("div", { style: "font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:" + sc.c + "; margin-bottom:6px;" }, evLabel),
    el("div", { style: "font-size:13.5px; line-height:1.5; color:var(--ink);" }, hasEv ? f.evidence : (f.evidence || "No supporting basis found in the transcript or chart."))));
  box.appendChild(chain);

  // transcript context
  const quote = extractQuote(f.evidence);
  const turns = parseTranscript(p.transcript || "");
  const ctxIdx = quote ? turns.findIndex((t) => t.text.toLowerCase().includes(quote.toLowerCase())) : -1;
  if (ctxIdx >= 0) {
    box.appendChild(el("div", { style: "font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-3); margin-bottom:8px;" }, "In the transcript"));
    const ctxBox = el("div", { style: "border:1px solid var(--line-2); border-radius:12px; overflow:hidden; margin-bottom:22px;" });
    const lo = Math.max(0, ctxIdx - 1), hi = Math.min(turns.length - 1, ctxIdx + 1);
    for (let i = lo; i <= hi; i++) {
      ctxBox.appendChild(turnRow(turns[i], i === ctxIdx ? quote : null, i === ctxIdx));
    }
    box.appendChild(ctxBox);
  }

  // judges
  if (f.escalated) {
    const jhead = el("div", { style: "display:flex; align-items:center; gap:8px; margin-bottom:12px;" });
    jhead.appendChild(el("div", { style: "font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-3);" }, "Judge ensemble"));
    jhead.appendChild(el("div", { style: "flex:1; height:1px; background:var(--line-2);" }));
    jhead.appendChild(pill(f.disagreement ? "split" : (f.consensus || ""), { color: "#fff", bg: f.disagreement ? VERDICT.split : (VERDICT[f.consensus] || VERDICT.reject) }));
    jhead.appendChild(el("div", { class: "mono", style: "font-size:11px; color:var(--muted-3);" }, f.confirm + " confirm / " + f.reject + " reject"));
    box.appendChild(jhead);

    if (f.disagreement) {
      box.appendChild(el("div", {
        style: "font-size:12px; line-height:1.5; color:#b23b3b; background:#fbeaea; border:1px solid #f3d0d0; " +
               "border-radius:10px; padding:10px 12px; margin-bottom:14px;",
      }, "⚠ The judges split on this one — the disagreement is surfaced, never averaged away."));
    }

    const votes = el("div", { style: "display:flex; flex-direction:column; gap:10px;" });
    (f.votes || []).forEach((v) => {
      const vc = VERDICT[v.verdict] || VERDICT.reject;
      votes.appendChild(el("div", { style: "border:1px solid var(--line-2); border-radius:11px; padding:12px 13px;" },
        el("div", { style: "display:flex; align-items:center; gap:8px; margin-bottom:6px;" },
          el("span", { style: "width:8px; height:8px; border-radius:50%; background:" + vc + "; flex:none;" }),
          el("span", { class: "mono", style: "font-size:12px; font-weight:600; color:var(--muted);" }, v.judge),
          el("span", { style: "margin-left:auto; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:" + vc + ";" }, (v.verdict || "") + " · " + (v.severity || ""))),
        el("div", { style: "font-size:12.5px; line-height:1.55; color:var(--muted);" }, v.rationale || "")));
    });
    box.appendChild(votes);
  } else {
    box.appendChild(el("div", {
      style: "font-size:12.5px; line-height:1.5; color:var(--muted-3); background:var(--field); " +
             "border:1px solid var(--line-2); border-radius:10px; padding:12px 13px;",
    }, "This finding was not escalated to the judge ensemble."));
  }

  return box;
}

function evidenceLabel(src) {
  switch (src) {
    case "transcript": return "The transcript says";
    case "fhir": return "The chart (FHIR) shows";
    case "both": return "Transcript & chart show";
    case "neither": return "No basis in transcript or chart";
    default: return "The transcript says";
  }
}

function turnRow(t, highlightNeedle, anchor) {
  const role = speakerRole(t.speaker);
  const tagColor = role === "dr" ? "var(--indigo)" : role === "pt" ? "var(--teal)" : "var(--muted-3)";
  const bg = anchor ? "var(--anchor-bg)" : "var(--card)";
  const border = anchor ? "var(--anchor-border)" : "transparent";
  return el("div", {
    "data-anchor": anchor ? "true" : "false",
    style: "padding:11px 13px; border-bottom:1px solid var(--line-3); display:flex; gap:11px; background:" + bg + "; " +
           (anchor ? "box-shadow:inset 3px 0 0 " + border + ";" : ""),
  },
    el("span", { class: "mono", style: "font-size:10px; font-weight:700; color:" + tagColor + "; flex:none; padding-top:2px;" }, (t.speaker || "•").toUpperCase().slice(0, 6)),
    el("div", { style: "font-size:13px; line-height:1.55; color:var(--ink-2);" }, highlighted(t.text, highlightNeedle)));
}

function renderTranscriptTab(p, sel) {
  const box = el("div", { style: "padding:16px 18px 40px;" });
  const turns = parseTranscript(p.transcript || "");
  if (!turns.length) {
    box.appendChild(el("div", { style: "color:var(--muted-3); font-size:13px;" }, "No transcript available."));
    return box;
  }
  const quote = sel ? extractQuote(sel.evidence) : null;
  const anchorIdx = quote ? turns.findIndex((t) => t.text.toLowerCase().includes(quote.toLowerCase())) : -1;
  turns.forEach((t, i) => {
    const isAnchor = i === anchorIdx;
    const role = speakerRole(t.speaker);
    const tagColor = role === "dr" ? "var(--indigo)" : role === "pt" ? "var(--teal)" : "var(--muted-3)";
    box.appendChild(el("div", {
      "data-anchor": isAnchor ? "true" : "false",
      style: "padding:9px 12px; margin-bottom:4px; border-radius:9px; display:flex; gap:11px; " +
             "background:" + (isAnchor ? "var(--anchor-bg)" : "var(--card)") + "; border:1px solid " + (isAnchor ? "var(--anchor-border)" : "transparent") + ";",
    },
      el("span", { class: "mono", style: "font-size:10px; font-weight:700; color:" + tagColor + "; flex:none; padding-top:2px;" }, (t.speaker || "•").toUpperCase().slice(0, 6)),
      el("div", { style: "font-size:13px; line-height:1.55; color:var(--ink-2);" }, highlighted(t.text, isAnchor ? quote : null))));
  });
  afterScroll();
  return box;
}

function renderNoteTab(p, sel) {
  const box = el("div", { style: "padding:18px 20px 40px;" });
  box.appendChild(el("div", { class: "mono", style: "font-size:11px; color:var(--muted-3); margin-bottom:12px;" },
    p.note_provided ? "SOAP note — supplied with the case, audited as-is" : "SOAP note — system under test"));
  const needle = sel ? sel.claim : null;
  box.appendChild(el("div", {
    "data-note": "1",
    style: "font-size:13px; line-height:1.7; color:var(--ink-2); white-space:pre-wrap;",
  }, highlighted(p.note || "", noteNeedle(p.note, needle))));
  afterScroll();
  return box;
}
// only highlight in the note if the claim text actually appears verbatim
function noteNeedle(note, claim) {
  if (!note || !claim) return null;
  return note.toLowerCase().includes(claim.toLowerCase()) ? claim : null;
}

function renderTrapsTab(traps, evalu) {
  const box = el("div", { style: "padding:18px 20px 40px;" });
  const per = (evalu && evalu.per_trap) || [];

  // scored summary line
  if (evalu && evalu.traps_drifted != null) {
    box.appendChild(el("div", {
      style: "display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;",
    },
      pill("scribe drifted · " + (evalu.traps_drifted || 0), { color: "#c77700", bg: "#fbf1e0" }),
      pill("caught · " + (evalu.drift_caught || 0), { color: "#12a150", bg: "#e7f6ee" }),
      pill("handled faithfully · " + (evalu.traps_faithful || 0), { color: "#4a5262", bg: "#f2f3f6" }),
      (evalu.recall != null ? pill("recall · " + Math.round(evalu.recall * 100) + "%", { color: "#fff", bg: "var(--indigo)" }) : null)
    ));
  }
  box.appendChild(el("div", { style: "font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.5;" },
    "Ground-truth traps planted in this synthetic case, graded against what the harness caught. A trap only counts toward recall if the scribe actually drifted on it — faithful handling that the auditor correctly ignores is not a miss."));

  traps.forEach((t, i) => {
    const r = per.find((x) => x.trap_index === i) || null;
    let tag = null, edge = "var(--indigo)";
    if (r) {
      if (!r.note_drifted) { tag = pill("handled faithfully", { color: "#4a5262", bg: "#f2f3f6" }); edge = "#a1a9b5"; }
      else if (r.caught) { tag = pill(r.confirmed_by_judges ? "caught · judge-confirmed" : "caught", { color: "#12a150", bg: "#e7f6ee" }); edge = "#12a150"; }
      else { tag = pill("MISSED drift", { color: "#fff", bg: "#d64545" }); edge = "#d64545"; }
    }
    box.appendChild(el("div", {
      style: "border:1px solid var(--line-2); border-left:3px solid " + edge + "; border-radius:10px; padding:13px 14px; margin-bottom:10px;",
    },
      el("div", { style: "display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;" },
        el("div", { style: "font-weight:700; font-size:13px; color:var(--indigo-dk);" }, t.trap_type || "trap"),
        tag),
      el("div", { style: "font-size:13px; line-height:1.5; color:var(--ink-2); margin-bottom:8px;" }, t.description || ""),
      el("div", { style: "font-size:12px; line-height:1.5; color:var(--muted-3);" },
        el("span", { style: "font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:10.5px;" }, "Expected note behavior: "),
        t.expected_note_behavior || ""),
      (r && r.note ? el("div", { style: "font-size:12px; line-height:1.5; color:var(--muted-2); margin-top:8px; font-style:italic;" }, "Grader: " + r.note) : null)));
  });
  return box;
}

// scroll the evidence pane so the highlighted anchor is visible
function afterScroll() {
  requestAnimationFrame(() => {
    const cont = $("dw-ev-scroll");
    if (!cont) return;
    const anchor = cont.querySelector('[data-anchor="true"]') || cont.querySelector("mark.dw");
    if (anchor) cont.scrollTop = Math.max(0, anchor.offsetTop - 90);
  });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function pickDefault(findings) {
  const ordered = orderFindings(findings);
  return ordered.length ? ordered[0].id : null;
}

function goHome() {
  state.screen = "picker";
  state.error = null;
  render();
  refreshRecent();
}

async function startRun() {
  state.error = null;
  const body = { max_findings: 6, mode: state.source };

  if (state.source === "abridge") {
    if (state.abridgeIndex == null && state.abridge.length) state.abridgeIndex = state.abridge[0].index;
    if (state.abridgeIndex == null) { state.error = "No encounter selected."; render(); return; }
    body.index = state.abridgeIndex;
    body.regenerate_note = state.regenerate;
  } else if (state.source === "custom") {
    const t = ($("c-transcript") || {}).value || "";
    const n = ($("c-note") || {}).value || "";
    if (!t.trim()) { state.error = "Paste a transcript to audit before running."; render(); return; }
    body.transcript = t;
    body.note = n.trim() ? n : null;
  }

  // enter running screen with an animated stage ticker
  state.screen = "running";
  state.stageIndex = 0;
  render();
  const iv = setInterval(() => {
    if (state.stageIndex < STAGES.length - 1) { state.stageIndex++; render(); }
  }, 8000);

  try {
    const payload = await apiRun(body);
    clearInterval(iv);
    state.payload = payload;
    state.selectedId = pickDefault(mergedFindings(payload));
    state.filter = "all";
    state.tab = "evidence";
    state.screen = "results";
    render();
    refreshRecent();
  } catch (e) {
    clearInterval(iv);
    state.error = (e && e.message) || "The run failed.";
    state.screen = "picker";
    render();
  }
}

async function refreshRecent() {
  state.recent = await apiResults();
  if (state.screen === "picker") render();
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  render(); // initial paint (picker with loading dropdown)
  await detectMode(); // live backend, or static demo replay?
  try {
    state.abridge = await apiAbridge();
    if (state.abridge.length) {
      // Default to the hero demo case (COVID admission — fabricated repeat vitals
      // is the sharpest live catch); fall back to the first encounter.
      const hero = state.abridge.find((a) => /covid|pneumonia|admission/i.test(a.visit_title || ""));
      state.abridgeIndex = hero ? hero.index : state.abridge[0].index;
    }
  } catch (e) {
    state.error = (e && e.message) || "Could not load encounters.";
  }
  await refreshRecent();
  render();
}
boot();
</script>
</body>
</html>
